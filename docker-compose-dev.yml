version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: connectit-postgres
    environment:
      POSTGRES_USER: connectit_user
      POSTGRES_PASSWORD: connectit_password
      POSTGRES_DB: connectit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - connectit-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: connectit-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@connectit.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - connectit-network

volumes:
  postgres_data:

networks:
  connectit-network:
    driver: bridge